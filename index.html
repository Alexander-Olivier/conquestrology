<title>Conquestrology</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&display=swap">
<style>
/* Layout concept: a phone app that becomes a website on wide screens. One ivory column on phones;
   on desktop the card and flag stay pinned on the left while the reading, on a paper panel, scrolls.
   Ivory and gold is the single finish; the empire's real border is drawn behind as a faint gold chart. */
:root {
  --bg: #ece4d2; --paper: #f4eee1; --card: #f4eee1; --fg: #221d16; --fg2: #6b5f4e;
  --gold: #b9975b; --gold-ink: #86692f; --gold-soft: rgba(185,151,91,0.35); --tint: #ecdfbf;
  --display: "Marcellus", "Times New Roman", serif; --body: "EB Garamond", Georgia, serif; --num: "Bodoni Moda", "Didot", Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 1.2rem; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3, p, ul, blockquote { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 3px; }
.caps { font-family: var(--display); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-ink); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--gold-soft); }
.bar .in { max-width: 520px; margin: 0 auto; height: 58px; display: flex; align-items: center; justify-content: space-between; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wordmark { background: none; border: 0; padding: 0; font-family: var(--display); letter-spacing: 0.18em; font-size: 0.95rem; text-transform: uppercase; }
.wordmark small { display: block; font-family: var(--body); font-style: italic; letter-spacing: 0; text-transform: none; font-size: 0.95rem; color: var(--fg2); margin-top: 1px; }
.bar .links { display: flex; gap: 18px; align-items: baseline; }
.linkish { background: none; border: 0; padding: 0; font-family: var(--display); font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-ink); }
.linkish:hover { color: var(--fg); }
.backbtn { justify-self: start; background: var(--paper); border: 1px solid var(--gold); padding: 7px 12px 7px 9px; font-family: var(--display); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg); cursor: pointer; transition: background-color 0.15s, color 0.15s; }
.backbtn span { font-size: 1.05rem; line-height: 0; margin-right: 2px; }
.backbtn:hover { background: var(--fg); color: var(--paper); border-color: var(--fg); }
.progress { height: 2px; background: var(--gold-soft); }
.progress i { display: block; height: 100%; width: 0; background: var(--gold-ink); transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

.page { position: relative; max-width: 520px; margin: 0 auto; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; min-width: 0; }
.bgmap { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: 0.3; }
.bgmap svg { width: 100%; height: 100%; display: block; }
.page > :not(.bgmap) { position: relative; z-index: 1; }

.rule { display: flex; align-items: center; gap: 12px; text-align: center; }
.rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: var(--gold); }
.btn { display: flex; justify-content: center; align-items: center; width: 100%; padding: 15px 18px; background: var(--fg); color: var(--paper); border: 0; font-family: var(--display); letter-spacing: 0.18em; font-size: 0.85rem; text-transform: uppercase; transition: transform 0.15s; }
.btn:hover { background: #3a3126; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--gold); }
.btn.ghost:hover { background: var(--paper); }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; text-align: center; padding-top: 6px; }
.hero-text { display: grid; gap: 14px; justify-items: center; }
.hero-art { display: grid; gap: 14px; justify-items: center; order: -1; }
.hero .mascot { width: 190px; aspect-ratio: 1; border: 1px solid var(--gold); padding: 5px; background: var(--paper); border-radius: 50%; overflow: hidden; }
.hero .mascot img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
.hero h1 { font-family: var(--display); font-size: clamp(1.75rem, 6.6vw, 2.3rem); letter-spacing: 0.03em; line-height: 1.18; text-wrap: balance; }
.hero p { color: var(--fg2); font-size: 1.22rem; max-width: 36ch; }
.fan { position: relative; height: 150px; width: 100%; margin-bottom: 20px; }
.fan .back { position: absolute; left: 50%; bottom: 0; width: 78px; aspect-ratio: 5 / 7; transform-origin: 50% 120%; border: 1px solid var(--gold); background: var(--paper); box-shadow: 0 10px 20px -14px rgba(0,0,0,0.6); overflow: hidden; }
.fan .back img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.twelve { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.twelve .f { min-width: 0; aspect-ratio: 3 / 2; border: 1px solid var(--gold); background: var(--paper); padding: 4px; }
.twelve .f img { width: 100%; height: 100%; object-fit: contain; display: block; }
.fine { color: var(--fg2); font-size: 1.05rem; font-style: italic; text-align: center; }

/* ---------- quiz ---------- */
.q-card { display: grid; gap: 16px; }
.q-card.in { animation: q-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
@keyframes q-in { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
.q-top { display: flex; justify-content: space-between; align-items: baseline; }
.q-art { aspect-ratio: 1; border: 1px solid var(--gold); background: var(--paper); padding: 5px; }
.q-art img { width: 100%; height: 100%; object-fit: cover; display: block; border: 1px solid var(--gold-soft); }
.q-body { display: grid; gap: 16px; }
.q-text { font-family: var(--display); font-size: 1.45rem; line-height: 1.3; text-wrap: balance; }
.answers { display: grid; gap: 9px; }
.ans { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: center; text-align: left; padding: 13px 14px; background: var(--paper); border: 1px solid var(--gold); font-size: 1.12rem; line-height: 1.3; transition: background 0.2s, transform 0.2s; }
.ans .k { font-family: var(--display); font-size: 0.75rem; color: var(--gold-ink); }
.ans:hover { background: #fbf7ee; transform: translateX(3px); }
.ans.picked { background: var(--fg); color: var(--paper); border-color: var(--fg); }
.ans.picked .k { color: var(--gold); }
.chapter { text-align: center; display: grid; gap: 14px; padding-block: 40px 20px; }
.chapter h2 { font-family: var(--display); font-size: 2.1rem; letter-spacing: 0.08em; }
.chapter p { color: var(--fg2); font-size: 1.25rem; font-style: italic; }
.chapter .flagwrap { width: 90px; margin: 0 auto; }

/* ---------- result ---------- */
.r-grid, .r-side, .reading { display: grid; gap: 18px; min-width: 0; }
.r-hero { display: grid; gap: 14px; justify-items: start; min-width: 0; padding-bottom: 20px; border-bottom: 1px solid var(--gold); }
.r-head { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
.r-head h1 { font-family: var(--display); font-size: clamp(1.1rem, 4.6vw, 1.45rem); font-weight: 400; letter-spacing: 0.04em; line-height: 1.12; }
.r-roast { font-family: var(--display); font-size: clamp(2rem, 8.2vw, 3.7rem); line-height: 1.1; letter-spacing: 0.01em; color: var(--fg); text-wrap: balance; max-width: 1060px; }
.r-roast.long { font-size: clamp(1.7rem, 6.8vw, 3rem); line-height: 1.13; }
.r-roast .hl { display: inline-block; }
.paper { background: var(--paper); border: 1px solid var(--gold); padding: 22px 18px; box-shadow: 0 1px 0 var(--gold-soft), 0 24px 40px -30px rgba(0,0,0,0.35); }
.reading { gap: 28px; }
.mapcard { border: 1px solid var(--gold); background: var(--paper); padding: 5px; }
.mapcard svg { width: 100%; height: auto; display: block; }
.mapcard.chart { border: 0; padding: 0; background: #E6D9B8; }
.mapcard.chart svg text { -webkit-user-select: none; user-select: none; }
.mapcard .cap { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 8px 4px 3px; font-size: 1.02rem; color: var(--fg2); font-style: italic; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 4px 2px; font-size: 0.98rem; color: var(--fg2); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--fg2); background: var(--sw); }
.boxes { display: grid; gap: 10px; }
.box { border: 1px solid var(--gold); padding: 12px 14px 12px; background: var(--paper); display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: start; }
.box .f { border: 1px solid var(--gold); padding: 3px; aspect-ratio: 3 / 2; }
.box .f img { width: 100%; height: 100%; object-fit: contain; display: block; }
.box b { display: block; font-family: var(--display); font-size: 1.05rem; letter-spacing: 0.02em; margin-top: 3px; }
.box p { font-size: 1.05rem; color: var(--fg2); line-height: 1.35; }
.why { border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); padding: 12px 0; display: grid; gap: 8px; }
.why div { display: grid; grid-template-columns: 60px 1fr; gap: 12px; align-items: baseline; }
.why b { font-family: var(--num); font-weight: 700; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.why b small { display: block; font-family: var(--display); font-size: 0.6rem; letter-spacing: 0.16em; color: var(--fg2); text-transform: uppercase; }
.part { display: grid; gap: 6px; text-align: center; padding-top: 6px; }
.part h2 { font-family: var(--display); font-size: 1.7rem; letter-spacing: 0.06em; }
.part p { color: var(--fg2); font-style: italic; font-size: 1.15rem; }
.sec { display: grid; gap: 8px; }
.bed { border: 1px solid var(--gold); background: var(--tint); }
.bed summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 14px 16px; cursor: pointer; list-style: none; }
.bed summary::-webkit-details-marker { display: none; }
.bed summary b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.25rem; letter-spacing: 0.06em; margin-top: 2px; }
.bed-go { flex: none; padding: 8px 12px; background: var(--fg); color: var(--paper); font-family: var(--display); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; }
.bed-go::before { content: "Tap to open"; }
.bed[open] .bed-go { background: none; color: var(--fg); box-shadow: inset 0 0 0 1px var(--gold); }
.bed[open] .bed-go::before { content: "Close"; }
.bed-in { display: grid; gap: 14px; padding: 6px 16px 22px; border-top: 1px solid var(--gold-soft); padding-top: 18px; }
.bed-in blockquote { margin: 0; font-family: var(--display); font-size: clamp(1.55rem, 6vw, 2.5rem); line-height: 1.14; letter-spacing: 0.01em; color: var(--fg); text-wrap: balance; }
.bed-in p { font-size: 1.2rem; max-width: 64ch; }
.sec h3 { font-family: var(--display); font-size: 1.05rem; letter-spacing: 0.16em; text-transform: uppercase; }
.sec p { font-size: 1.2rem; max-width: 64ch; }
.sec p + p { margin-top: 6px; }
.sec .pic { border: 1px solid var(--gold); background: var(--paper); padding: 4px; aspect-ratio: 1; }
.sec .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sec.illus .txt { display: grid; gap: 8px; }
.situ { background: var(--tint); border: 1px solid var(--gold); padding: 18px 16px; display: grid; gap: 10px; }
.situ .yr { font-family: var(--num); font-weight: 700; font-size: 2rem; line-height: 1; color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.now blockquote { border-left: 3px solid var(--gold); padding: 2px 0 2px 16px; display: grid; gap: 8px; }
.now blockquote p { font-style: italic; font-size: 1.22rem; }
.rel { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.rel h3 { font-family: var(--display); font-size: 0.85rem; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 8px; }
.rel ul { list-style: none; padding: 0; display: grid; gap: 10px; }
.rel li { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; }
.rel .f { min-width: 0; border: 1px solid var(--gold); background: var(--paper); padding: 3px; aspect-ratio: 3 / 2; }
.rel .f img { width: 100%; height: 100%; object-fit: contain; display: block; }
.rel b { display: block; font-family: var(--display); font-size: 0.85rem; letter-spacing: 0.04em; }
.rel span { font-size: 1.02rem; color: var(--fg2); line-height: 1.3; }
.actions { display: grid; gap: 10px; }
.credits { color: var(--fg2); font-size: 0.95rem; line-height: 1.4; }
.credits b { color: var(--fg); font-weight: 600; }

/* ---------- the card ---------- */
.card { position: relative; width: 100%; max-width: 360px; margin: 0 auto; background: var(--card); color: var(--fg); border-radius: 14px; padding: 12px; font-family: var(--body); box-shadow: 0 30px 50px -28px rgba(0,0,0,0.6), inset 0 0 0 1px var(--gold); overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 5px; border: 1px solid var(--gold); border-radius: 10px; pointer-events: none; opacity: 0.8; }
.card::after { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.035) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0,0,0,0.035) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
.card .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 4px 10px; }
.card .head .ttl { min-width: 0; }
.card .head .ttl b { display: block; font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.1; }
.card .head .ttl span { display: block; font-family: var(--display); font-size: 0.68rem; letter-spacing: 0.18em; color: var(--gold-ink); margin-top: 3px; }
.card .plate { flex: none; width: 60px; padding: 4px; background: var(--card); border: 1px solid var(--gold); }
.card .plate img { width: 100%; height: 34px; object-fit: contain; display: block; }
.card .plate.tall img { height: 44px; }
.card .artw { position: relative; aspect-ratio: 1 / 1.08; overflow: hidden; border: 1px solid var(--gold); box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 4px var(--gold); background: #e8dcc0; }
.card .artw img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .nameplate { text-align: center; padding: 12px 6px 2px; }
.card .nameplate i { display: block; font-size: 1.08rem; font-style: italic; color: var(--fg2); line-height: 1.3; }
.card .pos { display: flex; justify-content: center; align-items: center; gap: 10px; font-family: var(--display); font-size: 0.66rem; letter-spacing: 0.22em; color: var(--gold-ink); margin-top: 8px; }
.card .pos::before, .card .pos::after { content: ""; width: 26px; height: 1px; background: var(--gold); }
.card .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--gold); }
.card .stats div { text-align: center; min-width: 0; }
.card .stats span { display: block; font-family: var(--display); font-size: 0.56rem; letter-spacing: 0.14em; color: var(--fg2); text-transform: uppercase; }
.card .stats b { display: block; font-family: var(--num); font-weight: 700; font-size: 1.7rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-family: var(--display); font-size: 0.56rem; letter-spacing: 0.16em; color: var(--fg2); text-transform: uppercase; }
.card .foot span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .foot svg { height: 18px; width: auto; flex: none; }
.card.flip { animation: flip 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; transform-style: preserve-3d; }
@keyframes flip { from { transform: perspective(900px) rotateY(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- waving flag, pages only ---------- */
.flag { position: relative; --amp: 1.4px; }
.flag .cloth { position: relative; width: 100%; aspect-ratio: var(--ratio); display: grid; }
.flag.fly .cloth { grid-template-columns: repeat(14, 1fr); transform: skewY(-3deg); transform-origin: left center; }
.flag.hang .cloth { grid-template-rows: repeat(14, 1fr); transform: skewX(3deg); transform-origin: top center; }
.flag .cloth i { display: block; background-image: var(--img); background-repeat: no-repeat; animation: 1.8s ease-in-out infinite; }
.flag.fly .cloth i { background-size: 1400% 100%; background-position-x: calc(var(--i) / 13 * 100%); animation-name: wave-y; }
.flag.hang .cloth i { background-size: 100% 1400%; background-position-y: calc(var(--i) / 13 * 100%); animation-name: wave-x; }
@keyframes wave-y { 0%, 100% { transform: translateY(calc(var(--amp) * -1)); } 50% { transform: translateY(var(--amp)); } }
@keyframes wave-x { 0%, 100% { transform: translateX(calc(var(--amp) * -1)); } 50% { transform: translateX(var(--amp)); } }
.flag .pole { position: absolute; background: var(--gold); }
.flag.fly .pole { left: -4px; top: -5px; width: 3px; height: calc(100% + 14px); }
.flag.hang .pole { left: -5px; top: -3px; height: 3px; width: calc(100% + 10px); }
.flag.hang { width: 70%; margin: 0 auto; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: var(--fg); color: var(--paper); padding: 10px 16px; font-family: var(--display); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.sheet { display: grid; gap: 28px; min-width: 0; scroll-margin-top: 64px; }
.sheet2 { background: var(--tint); border-top: 4px double var(--gold-ink); }
.sheet2 .situ { background: var(--paper); }
.sheet2 .sec h3 { color: var(--fg); }
.open p { font-size: 1.32rem; font-style: italic; line-height: 1.38; }
.jump { justify-self: center; background: none; border: 0; border-bottom: 1px solid var(--gold); padding: 2px 1px; font-family: var(--display); font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg2); cursor: pointer; }
.jump:hover { color: var(--fg); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--gold); border: 1px solid var(--gold); }
.facts > div { background: var(--paper); padding: 10px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.facts b { font-family: var(--display); font-weight: 400; font-size: 1.02rem; line-height: 1.2; }
.facts i { color: var(--fg2); font-size: 0.98rem; line-height: 1.2; }
.traits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); padding: 14px 0; }
.traits h3 { font-family: var(--display); font-size: 0.85rem; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 6px; }
.traits ul { list-style: none; padding: 0; display: grid; gap: 2px; }
.traits li { font-size: 1.14rem; line-height: 1.25; }
.rel-wrap { display: grid; gap: 12px; border-top: 1px solid var(--gold); padding-top: 18px; }
.note, .sec small { color: var(--fg2); font-style: italic; font-size: 1.02rem; display: block; line-height: 1.3; }
.r-end { display: grid; gap: 18px; border-top: 1px solid var(--gold); padding-top: 22px; }
@media (min-width: 620px) { .facts { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 900px) and (max-height: 900px) { .r-side .card { max-width: 310px; } }
@media (min-width: 900px) and (max-height: 780px) { .r-side .card { max-width: 260px; } }
/* The deck page: one uniform grid per temperament */
#view-deck.page { max-width: 1180px; gap: 34px; }
.dk-title { display: grid; gap: 6px; justify-items: center; text-align: center; padding-top: 6px; }
.dk-title h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 6vw, 2.8rem); line-height: 1.12; }
.dk-title p { color: var(--fg2); font-style: italic; font-size: 1.15rem; }
.dk-sec { display: grid; gap: 14px; }
.dk-head { display: grid; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--gold); }
.dk-head h2 { font-family: var(--display); font-weight: 400; font-size: 1.45rem; letter-spacing: 0.04em; }
.dk-head p { color: var(--fg2); font-style: italic; font-size: 1.08rem; }
.dk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.dk { display: grid; grid-template-rows: auto auto auto; gap: 8px; width: 100%; padding: 8px; background: var(--card); border: 1px solid var(--gold); border-radius: 8px; color: var(--fg); text-align: left; cursor: pointer; transition: transform 0.18s, box-shadow 0.18s; box-shadow: 0 10px 16px -14px rgba(60,44,16,0.55); }

  function skyLoop(now) {
    var s = sky; if (!s || !s.running) return;
    if (s.burst) { s.burst = false; if (animOK()) s.cards.forEach(function (c) { c.x = s.cx + (c.x - s.cx) * 1.7; c.y = s.cy + (c.y - s.cy) * 1.7; c.s = 0.7; }); }
    var dt = Math.min((now - (s.last || now)) / 1000, 0.5); s.last = now;
    if (dt > 0) { var steps = Math.ceil(dt / 0.02); for (var i = 0; i < steps; i++) skyStep(dt / steps); skyPaint(); }
    s.raf = requestAnimationFrame(skyLoop);
  }
  function skySettle() { var s = sky; s.cards.forEach(function (c) { var h = skyHome(c, s.t); c.x = h[0]; c.y = h[1]; c.hx = h[0]; c.vx = c.vy = 0; }); for (var i = 0; i < 260; i++) skyStep(1 / 30); s.cards.forEach(function (c) { c.s = 1; c.vx = c.vy = 0; }); skyPaint(); }
  function skyPlay() {
    if (!sky) return; var s = sky; s.gather = false; skyMeasure();
    if (s.narrow) { skyStop(); swipeShow(); return; }
    if (REDUCED) { skySettle(); return; }
    if (s.running) return;
    skySettle();
    s.burst = true; s.running = true; s.last = 0; s.raf = requestAnimationFrame(skyLoop);
  }
  function skyStop() { if (sky) { sky.running = false; if (sky.raf) cancelAnimationFrame(sky.raf); } }
  function skyInit() {
    var st = $("stage"), els = [].slice.call(st.querySelectorAll(".fc"));
    sky = { stage: st, text: $("st-text"), cap: $("st-cap"), t: 0, mx: null, my: null, filter: null, gather: false, running: false, cards: [] };
    els.forEach(function (el, i) {
      var slot = (i * 7) % els.length, e = D.byId[el.dataset.id], layer = i % 3, c = { el: el, e: e, i: slot, layer: layer, a0: slot / els.length * Math.PI * 2 + (Math.random() - 0.5) * 0.12, om: [0.022, -0.016, 0.012][layer], f1: 0.3 + Math.random() * 0.5, f2: 0.25 + Math.random() * 0.45, p1: Math.random() * 6.28, p2: Math.random() * 6.28, rz: (Math.random() - 0.5) * 7, x: 0, y: 0, hx: 0, vx: 0, vy: 0, s: 1, w: 120, h: 170, lanePos: (slot % 6) * 120 + (slot % 4) * 37 };
      sky.cards.push(c);
      var txt = "<b>" + e.name + ", " + momentYear(e) + ".</b> <i>" + e.epithet + "</i>";
      var on = function () { c.hot = true; skyCaption(txt); }, off = function () { if (!c.drag) { c.hot = false; skyCaption(""); } };
      el.addEventListener("pointerenter", function (ev) { if (ev.pointerType === "mouse") on(); });
      el.addEventListener("pointerleave", function (ev) { if (ev.pointerType === "mouse") off(); });
      el.addEventListener("focus", function () { if (el.matches(":focus-visible")) on(); });
      el.addEventListener("blur", off);
      el.addEventListener("pointerdown", function (ev) {
        if (ev.pointerType !== "mouse" || REDUCED) return;
        var sx = ev.clientX, sy = ev.clientY, lx = sx, ly = sy, lt = performance.now(), moved = false;
        var mv = function (m) { var dx = m.clientX - lx, dy = m.clientY - ly, nw = performance.now(), d = Math.max(nw - lt, 8) / 1000; if (!moved && Math.abs(m.clientX - sx) + Math.abs(m.clientY - sy) > 6) { moved = true; c.drag = true; } if (moved) { c.x += dx; c.y += dy; c.vx = dx / d * 0.55; c.vy = dy / d * 0.55; } lx = m.clientX; ly = m.clientY; lt = nw; };
        var up = function () { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); if (moved) { c.drag = false; c.hot = false; c.justDragged = true; setTimeout(function () { c.justDragged = false; }, 60); skyCaption(""); } };
        window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
      });
      el.addEventListener("click", function () { if (c.justDragged) return; c.hot = false; skyCaption(""); openCard(e, "intro"); });
    });
    st.addEventListener("pointermove", function (ev) { if (ev.pointerType !== "mouse") return; var r = st.getBoundingClientRect(); sky.mx = ev.clientX - r.left; sky.my = ev.clientY - r.top; });
    st.addEventListener("pointerleave", function () { sky.mx = sky.my = null; });
    st.querySelectorAll(".chip").forEach(function (b) { b.addEventListener("click", function () {
      var t = b.dataset.t;
      if (sky.narrow) { for (var n = 0; n < swipe.items.length; n++) { if (swipe.items[n].e.t === t) { swipeTo(n, true); break; } } return; }
      var active = sky.filter === t; sky.filter = active ? null : t;
      st.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b && !active)); });
      if (REDUCED) skyPaint();
      skyCaption(sky.filter ? "<b>" + D.TEMPERAMENTS[t].plural + ".</b> <i>" + cap1(D.TEMPERAMENTS[t].line) + ".</i>" : "");
    }); });
    if (window.ResizeObserver) { var ro = new ResizeObserver(function () { if (!sky) return; skyMeasure(); if (REDUCED && !sky.narrow && state.view === "intro") skySettle(); }); ro.observe(st); ro.observe(sky.text); }
    var wasNarrow = window.innerWidth < 720;
    window.addEventListener("resize", function () { var n = window.innerWidth < 720; if (n !== wasNarrow) { wasNarrow = n; if (state.view === "intro") skyPlay(); } else if (n && swipe && state.view === "intro") swipeMeasure(); });
    window.addEventListener("resize", function () { if (sky) skyMeasure(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (sky) { skyMeasure(); if (REDUCED && !sky.narrow && state.view === "intro") skySettle(); } });
  }
  function startQuiz() { state.i = 0; state.answers = []; state.chapterSeen = {}; setView("quiz"); step(); }
  function setProgress() { var n = state.answers.filter(function (a) { return a !== undefined; }).length; $("progress").style.width = (n / ALLQ.length * 100) + "%"; $("counter").textContent = roman(state.i + 1) + " of " + roman(ALLQ.length); }
  function step() {
    var ch = D.CHAPTERS.filter(function (c) { return c.at === state.i; })[0];
    if (ch && !state.chapterSeen[ch.at]) { state.chapterSeen[ch.at] = true; renderChapter(ch); return; }
    renderQuestion();
  }
  function renderChapter(ch) {
    var e = E[Math.floor(Math.random() * E.length)];
    $("view-quiz").innerHTML = '<div class="chapter"><div class="flagwrap">' + flagWave(e) + '</div><span class="caps">Chapter ' + roman(D.CHAPTERS.indexOf(ch) + 1) + "</span><h2>" + ch.title + "</h2><p>" + ch.line + '</p><button class="btn" id="go" type="button">Continue</button></div>';
    setProgress();

  }
  function renderQuestion() {
    var q = ALLQ[state.i];
    var h = '<div class="q-card' + (animOK() ? " in" : "") + '"><div class="q-top"><span class="caps">' + q.topic + '</span><span class="caps">' + roman(state.i + 1) + '</span></div>' +
      '<div class="q-art"><img src="' + q.art + '" alt="" onerror="this.parentNode.remove()"></div><div class="q-body">' +
      '<h2 class="q-text">' + q.q + '</h2><div class="answers">' +
      q.a.map(function (a, idx) { return '<button type="button" class="ans' + (state.answers[state.i] === idx ? " picked" : "") + '" data-idx="' + idx + '"><span class="k">' + "ABCD"[idx] + "</span><span>" + a.text + "</span></button>"; }).join("") +
      "</div>" + (state.i > 0 ? '<button type="button" class="linkish" id="back">Back</button>' : "") + "</div></div>";
    $("view-quiz").innerHTML = h; setProgress(); window.scrollTo(0, 0);
    document.querySelectorAll(".ans").forEach(function (b) { b.addEventListener("click", function () { answer(+b.dataset.idx); }); });
    if ($("back")) $("back").addEventListener("click", function () { state.i--; renderQuestion(); });
  }
  var locked = false;
  function answer(idx) {
    if (locked) return; locked = true;
    state.answers[state.i] = idx;
    document.querySelectorAll(".ans").forEach(function (b) { b.classList.toggle("picked", +b.dataset.idx === idx); });
    setProgress();
    setTimeout(function () { locked = false; if (state.i === ALLQ.length - 1) showResult(compute()); else { state.i++; step(); } }, animOK() ? 260 : 0);
  }
  document.addEventListener("keydown", function (e) {
    if (state.view !== "quiz" || !document.querySelector(".ans")) return;
    var k = e.key.toLowerCase(), idx = "1234".indexOf(k) >= 0 ? +k - 1 : "abcd".indexOf(k);
    if (idx >= 0 && idx < ALLQ[state.i].a.length) { e.preventDefault(); answer(idx); }
  });
  function compute() {
    var t = { F: 0, E: 0, A: 0, W: 0 }, m = { C: 0, X: 0, M: 0 };
    Q.forEach(function (q, i) { var a = q.a[state.answers[i]]; if (!a) return; var w = 1 + (Q.length - i) * 0.001; if (a.t) t[a.t] += w; else m[a.m] += w; });
    var tk = Object.keys(t).sort(function (x, y) { return t[y] - t[x]; }), mk = Object.keys(m).sort(function (x, y) { return m[y] - m[x]; });
    var hi = 0, st = 0, tags = [];
    SQ.forEach(function (q, i) { var a = q.a[state.answers[Q.length + i]]; if (!a) return; if (a.s === "high") hi++; else st++; tags.push([a.s, a.tag]); });
    var stt = st >= hi ? "strain" : "high"; /* a 3 to 3 tie counts as strain: five of the six questions offer two "doing well" answers, so otherwise strain cards almost never appear */
    var now = tags.filter(function (x) { return x[0] === stt; }).map(function (x) { return x[1]; }).slice(0, 2);
    return { sun: D.findMoment(tk[0], mk[0], stt), moon: D.findMoment(tk[1], mk[0], stt), rising: D.findMoment(tk[0], mk[1], stt), now: now };
  }

  function bedSec(e) {
    var b = (window.EMPIRE_BED || {})[e.id];
    if (!b) return "";
    return '<details class="bed"><summary><span><span class="caps">Adults only, 18+</span><b>In bed</b></span><span class="bed-go" aria-hidden="true"></span></summary><div class="bed-in"><span class="caps">Your kink: ' + b.kink + "</span><blockquote>&ldquo;" + b.quote + "&rdquo;</blockquote><p>" + b.text + "</p></div></details>";
  }
  function sec(title, body, pic, flip) {
    var ps = (Array.isArray(body) ? body : [body]).map(function (p) { return "<p>" + p + "</p>"; }).join("");
    if (!pic) return '<section class="sec"><h3>' + title + "</h3>" + ps + "</section>";
    return '<section class="sec illus' + (flip ? " flip-side" : "") + '"><div class="pic"><img src="' + pic + '" alt="" onerror="var s=this.parentNode.parentNode; s.classList.remove(\'illus\'); this.parentNode.remove()"></div><div class="txt"><h3>' + title + "</h3>" + ps + "</div></section>";
  }
  function relList(items) { return "<ul>" + items.map(function (r) { var o = r[0]; return "<li>" + flagStill(o) + "<div><b>" + o.name + ", " + momentYear(o) + "</b><span>" + r[1] + "</span></div></li>"; }).join("") + "</ul>"; }
  function showResult(res) {
    var e = res.sun, T = D.TEMPERAMENTS[e.t], M = D.MODES[e.m], art = "art/sections/" + e.id + "-", cp = compat(e), R = e.r, yr = momentYear(e);
    function fact(k, v, sub) { return "<div><span class=\"caps\">" + k + "</span><b>" + v + "</b>" + (sub ? "<i>" + sub + "</i>" : "") + "</div>"; }
    function traits(k, list) { return "<div><h3>" + k + "</h3><ul>" + list.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul></div>"; }
    var nowQ = (res.now || []).map(function (t) { return "<p>" + MM.NOW[t] + "</p>"; }).join("") + (e.nowLine ? "<p>" + e.nowLine + "</p>" : "");
    var backLabel = backTo === "deck" ? "Back to the deck" : "Back to all cards";
    var h = '<div class="bgmap"></div><header class="r-hero">' +
      (res.now ? "" : '<button class="backbtn" id="back-top" type="button"><span aria-hidden="true">&#8249;</span> ' + backLabel + "</button>") +
      '<div class="r-head">' + flagWave(e) + '<div><span class="caps">' + (res.now ? "Your card" : "From the deck") + '</span><h1>' + e.name + ", " + yr + "</h1></div></div>" +
      '<p class="r-roast' + (e.roast.length > 60 ? " long" : "") + '">' + e.roast.split(/(?<=[.?])\s+/).map(function (x) { return '<span class="hl">' + x + "</span>"; }).join(" ") + "</p>" +
      '</header><div class="r-grid"><aside class="r-side">' +
      card(e, animOK() ? "flip" : "") +
      '</aside><div class="reading"><div class="paper sheet">' +
      chartSlot(e, "main") +
      '<div class="boxes">' +
        '<div class="box">' + flagStill(res.sun) + '<div><span class="caps">Who you are</span><b>' + res.sun.name + ", " + momentYear(res.sun) + "</b><p>" + res.sun.epithet + "</p></div></div>" +
        '<div class="box">' + flagStill(res.rising) + '<div><span class="caps">What you want</span><b>' + cap1(WANTS[res.rising.m]) + "</b><p>When nobody is watching you act like " + res.rising.name + ", " + momentYear(res.rising) + ".</p></div></div>" +
        '<div class="box">' + flagStill(res.moon) + '<div><span class="caps">What you need</span><b>' + cap1(NEEDS[res.moon.t]) + "</b><p>The card that steadies you is " + res.moon.name + ", " + momentYear(res.moon) + ". Keep one nearby.</p></div></div>" +
      "</div>" +
      '<button class="jump" id="jump" type="button">Skip to your situation in ' + yr + "</button>" +
      '<div class="why">' + e.stats.map(function (s) { return "<div><b>" + s[1] + "<small>" + s[0] + "</small></b><p>" + s[2] + "</p></div>"; }).join("") + "</div>" +
      '<div class="part"><span class="caps">Part one</span><h2>Your sign</h2><p>' + e.name + ". This is who you are in any year.</p></div>" +
      '<div class="facts">' +
        fact("Temperament", T.name, T.line) + fact("Mode", M.name, M.line) +
        fact("Ruled by", e.resource) + fact("Patron", e.patron) +
        fact("Best century", e.century) + fact("Home", e.capital) +
        fact("Lucky charm", R.lucky) + fact("Avoid", R.avoid) +
      "</div>" +
      sec("The sign", R.sign) +
      '<div class="traits">' + traits("Strengths", R.strengths) + traits("Weaknesses", R.flaws) + "</div>" +
      sec("At your best", R.best, art + "best.jpg") +
      sec("At your worst", R.worst) +
      sec("In love", R.love, art + "love.jpg", true) +
      bedSec(e) +
      sec("With friends", R.friends) +
      sec("At work", R.work, art + "work.jpg") +
      sec("With money", R.money) +
      '<div class="rel-wrap"><p class="note">Compatibility goes by sign. What these empires did to each other in history does not count here.</p><div class="rel"><div><h3>Gets along with</h3>' + relList(cp.allies) + "</div><div><h3>Clashes with</h3>" + relList(cp.rivals) + "</div></div></div>" +
      '</div><div class="paper sheet sheet2" id="situation-sheet">' +
      '<div class="part"><span class="caps">Part two</span><h2>Your situation</h2><p>Your sign stays with you. This is the year you happen to be in.</p></div>' +
      '<section class="sec situ"><div class="yr">' + yr + '</div><div class="open"><p>' + R.open + "</p></div></section>" +
      chartSlot(e, "sit") +
      sec("How you got here", R.how) +
      sec("Who is on the map", [R.around, "<small>These are the real players of the year, which is a different question from who suits you.</small>"], art + "situation.jpg", true) +
      '<section class="sec"><h3>In your life</h3>' + R.life.map(function (p) { return "<p>" + p + "</p>"; }).join("") + "</section>" +
      (nowQ ? '<section class="sec now"><h3>Right now</h3><blockquote>' + nowQ + "</blockquote></section>" : "") +
      sec("What happens next", R.next) +
      '<div class="r-end">' +
      (res.now ? '<div class="actions"><button class="btn" id="copy" type="button">Copy my reading</button><button class="btn ghost" id="retake" type="button">Draw again</button></div>' : '<div class="actions"><button class="btn" id="take" type="button">Which empire am I?</button><button class="btn ghost" id="back-bottom" type="button">' + backLabel + '</button></div>') +

    if (!res.now) { $("back-top").addEventListener("click", goBack); $("retake-top").hidden = true; } $("progress").style.width = "100%";
    bgMap($("view-result").querySelector(".bgmap"), e);
    try { history.replaceState(null, "", "#" + res.sun.id + "-" + res.moon.id + "-" + res.rising.id); } catch (err) {}
    var text = "I drew " + e.name + " (" + e.moment + "). " + e.roast + " Ambition " + e.stats[0][1] + ", Patience " + e.stats[1][1] + ", Chaos " + e.stats[2][1] + ", Drama " + e.stats[3][1] + ". What I want: " + WANTS[res.rising.m] + ". What I need: " + NEEDS[res.moon.t] + ". Conquestrology: astrology, with receipts.";
    if ($("take")) { $("take").addEventListener("click", startQuiz); $("back-bottom").addEventListener("click", goBack); }
    if ($("copy")) $("copy").addEventListener("click", function () {
      var ok = function () { var t = $("toast"); t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text); ok(); }); else { fallbackCopy(text); ok(); }

    $("jump").addEventListener("click", function () { $("situation-sheet").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" }); });
  }
  function fallbackCopy(text) { var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.left = "-9999px"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta); }
  function renderDeck() {
    var secs = ["F", "E", "A", "W"].map(function (t) {
      var T = D.TEMPERAMENTS[t], cards = E.filter(function (e) { return e.t === t; }).sort(function (a, b) { return "CXM".indexOf(a.m) - "CXM".indexOf(b.m) || (a.state === "high" ? 0 : 1) - (b.state === "high" ? 0 : 1); });
      return '<section class="dk-sec"><div class="dk-head"><h2>' + T.plural + "</h2><p>" + cap1(T.line) + '.</p></div><div class="dk-grid">' + cards.map(function (e) {
        return '<button type="button" class="dk" data-id="' + e.id + '" aria-label="Open ' + esc(e.name + ", " + momentYear(e)) + '"><span class="dk-top"><span class="dk-name">' + e.name + '</span><img class="dk-flag" src="flags/' + e.flagKey + '.svg" alt=""></span><img class="dk-art" src="art/thumbs/' + e.id + '.jpg" alt="" loading="lazy"><span class="dk-foot"><span>' + momentYear(e) + "</span><span>" + D.MODES[e.m].name + "</span></span></button>";
      }).join("") + "</div></section>";
    }).join("");
    $("view-deck").innerHTML = '<div class="dk-title"><h1>The deck</h1><p>Twenty-four empires, four temperaments. Open any card.</p></div>' + secs + '<button class="btn dk-end" id="deck-go" type="button">Which empire am I?</button>';
    $("deck-go").addEventListener("click", startQuiz);
    [].slice.call($("view-deck").querySelectorAll(".dk")).forEach(function (el) { el.addEventListener("click", function () { openCard(D.byId[el.dataset.id], "deck"); }); });
    setView("deck");
  }
  function restart() { state.i = 0; state.answers = []; state.chapterSeen = {}; $("view-result").innerHTML = ""; try { history.replaceState(null, "", location.pathname + location.search); } catch (err) {} $("progress").style.width = "0%"; setView("intro"); }

  /* ---------- boot ---------- */
  function fromHash() { var m = /^#([a-z0-9]+)-([a-z0-9]+)-([a-z0-9]+)$/.exec(location.hash || ""); return m && D.byId[m[1]] && D.byId[m[2]] && D.byId[m[3]] ? { sun: D.byId[m[1]], moon: D.byId[m[2]], rising: D.byId[m[3]] } : null; }
  function start(saved) {
    renderIntro();
    $("home").addEventListener("click", restart); $("retake-top").addEventListener("click", restart); $("deck-link").addEventListener("click", renderDeck);
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && state.view === "result" && $("back-top")) goBack(); });
    window.addEventListener("hashchange", function () { var r = fromHash(); if (r) { $("view-result").innerHTML = ""; showResult(r); } else if (state.view === "result") goBack(); });
    var r = fromHash();
    if (saved && saved.view === "quiz" && saved.answers) { state.i = saved.i || 0; state.answers = saved.answers; state.chapterSeen = saved.chapterSeen || {}; setView("quiz"); renderQuestion(); }
    else if (r) showResult(r); else setView("intro");
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return { view: state.view, i: state.i, answers: state.answers, chapterSeen: state.chapterSeen }; });
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
